name: Android UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-ui-tests:
    name: Run Appium Paywall Suite (Android API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium and UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium driver list --installed

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android Emulator and Execute Tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-4-hydrogen' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            mkdir -p target
            appium --address 127.0.0.1 --port 4723 --log-level error > target/appium.log 2>&1 &
            APPIUM_PID=$!
            trap "kill $APPIUM_PID || true" EXIT

            echo "Waiting for Appium server to become ready..."
            timeout 30 bash -c 'until curl -s http://127.0.0.1:4723/status | grep -q "\"ready\":true"; do sleep 1; done'

            mvn test -B -Denv=ci

      - name: Upload Test Reports and Failure Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-and-diagnostics
          path: |
            target/surefire-reports/
            target/diagnostics/
            target/appium.log
          if-no-files-found: ignore
          retention-days: 14